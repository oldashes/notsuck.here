<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — 这页 sucks | notsuck.here</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --bg:#fafaf7; --fg:#121212; --muted:#6e6e68; --line:#e4e4dd; --accent:#c6f432; --red:#ff5a4e;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f0f0e; --fg:#f0f0ea; --muted:#96968e; --line:#262624; } }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family:var(--sans); min-height:100vh; display:grid; place-items:center; padding:24px; -webkit-font-smoothing:antialiased; }
  .box { max-width:520px; }
  .code { font:800 clamp(88px,22vw,160px)/1 var(--mono); letter-spacing:-0.06em; }
  .code span { color:var(--red); display:inline-block; animation:wobble 2.4s ease-in-out infinite; }
  @keyframes wobble { 0%,100% { transform:rotate(0); } 50% { transform:rotate(-12deg) translateY(4px); } }
  h1 { font-size:26px; margin:20px 0 10px; letter-spacing:-0.02em; }
  p { color:var(--muted); line-height:1.7; }
  ol { margin:18px 0 32px; padding-left:20px; color:var(--muted); font-size:15px; line-height:1.9; }
  a.btn { display:inline-block; text-decoration:none; font-weight:600; background:var(--fg); color:var(--bg); padding:12px 20px; border-radius:10px; }
  a.btn:hover { background:var(--accent); color:#121212; }
  .path { font:13px var(--mono); color:var(--muted); border:1px dashed var(--line); padding:3px 8px; border-radius:6px; word-break:break-all; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">4<span>0</span>4</div>
    <h1>这个页面 sucks。</h1>
    <p>因为它根本不存在。你访问的 <span class="path" id="p"></span> 可能：</p>
    <ol>
      <li>被你手滑打错了</li>
      <li>被我删了（它不够 notsuck）</li>
      <li>从来就没被 vibe 出来过</li>
    </ol>
    <a class="btn" href="/">回到不烂的地方 →</a>
  </div>
  <script>document.getElementById("p").textContent = location.pathname;</script>
</body>
</html>
